<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="./css/style.css">

<body>
     <header class="homeheader">
        <div class="logo_buscador">
            <a href="./index.html" class="logo link">
                <img src="./imagenes/logoconnombre.png" alt="logo">

        </div>
