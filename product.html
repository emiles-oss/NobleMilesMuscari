<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="header">
        <div class="logo_buscador">
            <a href="./index.html" class="logo link">
                <img src="./imagenes/logoconnombre.png" alt="logo">
            </a>
            <a href="./index.html" class="home">Home</a>
            <form class="buscador" action="./search-results.html" method="get">
                <input class="input-buscador" type="text" name="buscador" placeholder="Buscar productos..." required>
                <button type="submit" class="buscar">Buscar</button>
            </form>
        </div>
        <div class="login-registro">
            <a href="./login.html">Login</a>
            <span>|</span>
            <a href="./register.html">Registro</a>
        </div>
    </header>
    <main class="main-index">
        <div class="menu">
        <h3>Categorias</h3>
        <nav class="menu-lista">
            <ul id="lista-menu" ></ul>
        </nav>
        </div>
        <div>
                <div class="producto-uni">
                    <img src="" alt="" id="product-image">
                </div>
                <div class="caracteristicas">
                    <div>
                        <h1 id="product-title" class="caracter"></h1>
                        <p id="product-brand" class="caracter"></p>
                        <p id="product-description" class="caracter"></p>
                        <p id="product-price" class="caracter"></p>
                        <p id="product-stock" class="caracter">/</p>
                        <a id="product-category" href="" class="caracter"></a>
                    </div>
                    <div class="tag">
                        <ul id="product-tags" class="deportivo"></ul>
                    </div>
                </div>
                <div id="product-reviews" class="resenas"></div>
        </div>
    </main>

    <footer>
        <div class="logo-sinnombre"><img src="./imagenes/logo.png" alt="logo"></div>
        <nav>
            <ul class="nombres">
                <li class="nombre-particular">Enrique Miles</li>
                <li class="nombre-particular">Juan Bautista Noble</li>
                <li class="nombre-particular">Rafael Muscari</li>
            </ul>
        </nav>
    </footer>
    <script src="./js/product.js"></script>
</body>

</html>
