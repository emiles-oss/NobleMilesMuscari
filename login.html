<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
      <header class="header">
        <div class="logo_buscador">
            <a href="./index.html" class="logo link">
                <img src="./imagenes/logoconnombre.png" alt="logo">
            </a>
            <a href="./index.html" class="home">Home</a>
        <form  class="buscador" action="./search-results.html" method="get">
            <input class="input-buscador" type="text" name="buscador" placeholder="Buscar productos..." required>
            <button type="submit" class="buscar">Buscar</button>
        </form>
        </div>
        <div class="login-registro">
            <a id="menu-login" href="./login.html">Login</a>
            <span id="menu-separador">|</span>
            <a id="menu-registro" href="./register.html">Registro</a>
        </div>
        <p id="saludo"></p>
        <a id="link-logout" href="#">logout</a>
    </header>
    <main class="main-index">
    <div class="menu">
        <h3>Categorias</h3>
        <nav class="menu-lista">
            <ul id="lista-menu" ></ul>
        </nav>
        </div>
    <div class="login">
        <form id="form-login">
            <div class="email">
                <label for="email">Email:</label>
                <input id="email" type="email" name="email">
            </div>
            <div class="email">
                <label for="contraseña">Contraseña:</label>
                <input id="contraseña" type="password" name="contraseña">
            </div>
            <p id="mensaje-error"></p>
            <div class="email">
                <button class="ingresar" type="submit">Ingresar</button>
                <span><a class="cuenta" href="./register.html">No tengo cuenta</a></span>
            </div>
        </form>
    </div>
</main>
    <footer>
        <div class="logo-sinnombre"><img src="./imagenes/logo.png" alt="logo"></div>
        <nav>
            <ul class="nombres">
                <li class="nombre-particular">Enrique Miles</li>
                <li class="nombre-particular">Juan Bautista Noble</li>
                <li class="nombre-particular">Rafael Muscari</li>
            </ul>
        </nav>
    </footer>
    <script src="./js/login.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
</body>
</html>
